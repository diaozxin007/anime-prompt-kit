[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "anime-prompt-kit"
version = "0.1.1"
description = "Local anime character prompt templates and composer with a Python API and CLI"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "diaozxin007"}]
keywords = ["anime", "prompts", "character-design", "templates"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.11",
  "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://ai-anime-generator.io/"
Documentation = "https://ai-anime-generator.io/open-source"
Source = "https://github.com/diaozxin007/anime-prompt-kit"
Issues = "https://github.com/diaozxin007/anime-prompt-kit/issues"

[project.scripts]
anime-prompt-kit = "anime_prompt_kit.cli:main"

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
anime_prompt_kit = ["templates.json"]
