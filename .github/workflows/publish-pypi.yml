name: Publish Python package
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact approved package version (for example 0.1.0)'
        required: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check version and branch
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          python -c 'import os, tomllib; assert tomllib.load(open("pyproject.toml", "rb"))["project"]["version"] == os.environ["EXPECTED_VERSION"]'
      - run: npm test
      - run: PYTHONPATH=python python -m unittest discover -s tests -v
      - run: python -m pip install build twine
      - run: python -m build && python -m twine check dist/*
      - name: Test installed distribution
        run: |
          python -m venv /tmp/package-test
          /tmp/package-test/bin/pip install --no-index --no-deps dist/*.whl
          cd /tmp
          /tmp/package-test/bin/anime-prompt-kit --list
          /tmp/package-test/bin/anime-prompt-kit sky-courier --setting 'a snowy station'
          /tmp/package-test/bin/python -c 'from anime_prompt_kit import list_templates; assert len(list_templates()) == 12'
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/anime-prompt-kit/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
